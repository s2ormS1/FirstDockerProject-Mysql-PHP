services:
  nginx:
    restart: unless-stopped
    image: nginx:latest
    ports:
      - "8080:80"
    volumes: 
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/my:/var/www/html:ro
    depends_on:
      - php
  php:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./backend/my:/var/www/html
    depends_on:
      - db

  db:
    restart: unless-stopped
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./travel_agency.sql:/docker-entrypoint-initdb.d/travel_agency.sql:ro

volumes:
  mysql_data:
