services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
  php:
    build:
      context: .
      dockerfile: Dockerfile

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./travel_agency.sql:/docker-entrypoint-initdb.d/travel_agency.sql:ro

volumes:
  mysql_data:
